plugins {
    id 'com.android.application'
}

apply from: 'game-assets.gradle'

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def ciDebugSigning = providers.gradleProperty('OurTaikoCiDebugSigning').orNull == 'true'
def ciReleaseSigning = !!System.getenv('ANDROID_KEYSTORE_PASSWORD')

android {
    namespace 'org.ourtaiko.fanmade'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.ourtaiko.fanmade'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments(
                    "-DANDROID_FFMPEG_PREFIX=${rootProject.file('../.android-ffmpeg').absolutePath}",
                    "-DANDROID_OPENSSL_PREFIX=${rootProject.file('../.android-openssl').absolutePath}",
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_PLATFORM=android-29"
                )
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [
                'src/main/assets',
                layout.buildDirectory.dir('generated/game_assets').get()
            ]
        }
    }

    preBuild.dependsOn 'copyGameAssets'

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.name == 'release' ? 'OurTaiko-Android.apk' : "OurTaiko-Android-${variant.name}.apk"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            if (ciReleaseSigning) {
                storeFile rootProject.file('ourtaiko-release.jks')
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            } else if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ciDebugSigning ? signingConfigs.debug : signingConfigs.release
        }
        debug {
            jniDebuggable true
        }
    }
}
