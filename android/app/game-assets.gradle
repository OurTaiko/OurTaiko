// Shared by the Android build and the standalone asset-packaging check.
def gameAssetsDir = layout.buildDirectory.dir('generated/game_assets')
def repositoryDir = rootProject.file('..')

tasks.register('copyGameAssets', Sync) {
    into gameAssetsDir
    from(new File(repositoryDir, 'Skins')) {
        into 'GameData/Skins'
        exclude '**/.git', '**/.git/**', '**/.git*', '**/.DS_Store'
    }
    from(new File(repositoryDir, 'Songs')) {
        into 'GameData/Songs'
        exclude '**/.git', '**/.git/**', '**/.git*', '**/.DS_Store'
    }
    from(new File(repositoryDir, 'shader/es')) { into 'shader/es' }
    from(repositoryDir) {
        include 'LICENSE', 'NOTICE'
        into 'GameData'
    }
    // Keep license files at the APK asset root as well.
    from(repositoryDir) { include 'LICENSE', 'NOTICE' }
    from(new File(repositoryDir, 'config.toml')) {
        into 'GameData'
        filteringCharset = 'UTF-8'
        filter { line ->
            line.replaceAll(/^touch_input\s*=\s*false\s*$/, 'touch_input = true')
                .replaceAll(/^vsync\s*=\s*false\s*$/, 'vsync = true')
        }
    }
    doFirst {
        ['PyTaikoGreen', 'YataiDONRed', 'YataiDONNijiiro'].each { skin ->
            if (!new File(repositoryDir, "Skins/${skin}/Graphics/skin_config.json").isFile()) {
                throw new GradleException("Missing ${skin} assets. Populate the skin submodules before building Android.")
            }
        }
    }
}
